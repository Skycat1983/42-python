[project]
name = "matrix-loading"
version = "0.1.0"
description = "a simulated Matrix signal analysis exercise"
authors = [
    {name = "42 Student"}
]
requires-python = ">=3.10,<4.0"
dependencies = [
    "numpy (>=1.24,<3.0)",
    "pandas (>=2.0,<3.0)",
    "matplotlib (>=3.7,<4.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"